name: Lint Backend
on: 
  pull_request:
  push:
    branches:
      - main

jobs:
  linting:
    name: Linting Backend
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6

      - name: Format Backend
        uses: astral-sh/ruff-action@v1
        with:
          src: ./backend
          args: "format --check"
          changed-files: "true"

      - name: Lint Backend
        uses: astral-sh/ruff-action@v1
        with:
          src: ./backend
          args: "check"
          changed-files: "true"
